name: Build AZenithGameSpace APK

on:
  push:
    branches: [ main, "feat/**" ]
    paths:
      - 'manager/**'
      - 'changelog.md'
      - '.github/workflows/build-prebuilt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Copy changelog asset
        run: |
          if [ -f changelog.md ]; then
            cp changelog.md manager/app/src/main/assets/changelog.md
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug & Release APKs
        working-directory: ./manager
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Stage APK artifacts
        run: |
          set -euo pipefail
          DEBUG_APK=$(find manager/app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -n 1)
          RELEASE_APK=$(find manager/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          mkdir -p apk-artifacts
          cp "$DEBUG_APK" apk-artifacts/AZenithGameSpace-debug.apk
          cp "$RELEASE_APK" apk-artifacts/AZenithGameSpace-release.apk
          (cd apk-artifacts && sha256sum *.apk > SHA256SUMS)
          ls -lh apk-artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azenith-gamespace-apk-${{ github.sha }}
          path: apk-artifacts/
          if-no-files-found: error

      - name: Update prebuilt APK on main branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p prebuilt
          cp apk-artifacts/AZenithGameSpace-release.apk prebuilt/AZenithGameSpace.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/AZenithGameSpace.apk
          if ! git diff --cached --quiet; then
            git commit -m "prebuilt: Update AZenithGameSpace.apk [skip ci]"
            git push
          fi
