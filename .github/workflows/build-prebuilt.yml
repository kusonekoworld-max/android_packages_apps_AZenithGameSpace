name: Build Prebuilt AZenithGameSpace APK

on:
  push:
    branches: [ main ]
    paths:
      - 'manager/**'
      - 'changelog.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Copy changelog asset
        run: |
          if [ -f changelog.md ]; then
            cp changelog.md manager/app/src/main/assets/changelog.md
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        working-directory: ./manager
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Commit Prebuilt APK
        run: |
          APK=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -f "$APK"
          mkdir -p prebuilt
          cp "$APK" prebuilt/AZenithGameSpace.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/AZenithGameSpace.apk
          if ! git diff --cached --quiet; then
            git commit -m "prebuilt: Update AZenithGameSpace.apk [skip ci]"
            git push
          fi
